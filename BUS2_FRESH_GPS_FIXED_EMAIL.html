<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1976d2">
  <title>لوحة السائق - باص 2</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}
    :root{--blue:#1976d2;--blue2:#0d47a1;--green:#43b05c;--red:#ef2b2d;--bg:#f4f6f8;--text:#172033}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
    button,input{font:inherit}
    .page{min-height:100vh}
    .hidden{display:none!important}
    #loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#1976d2 0 34%,#f4f6f8 34%)}
    .login-card{width:min(520px,100%);background:#fff;border-radius:30px;padding:28px 22px 30px;box-shadow:0 16px 45px rgba(0,0,0,.16)}
    .bus-icon{font-size:54px;text-align:center;margin-top:-6px}
    .login-title{text-align:center;color:var(--blue);font-size:30px;font-weight:900;margin:8px 0 5px}
    label{display:block;font-weight:800;margin:12px 0 7px}
    input{width:100%;padding:15px 16px;border:1px solid #d0d5dd;border-radius:15px;font-size:17px;outline:none;background:#fff}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,118,210,.12)}
    .btn{width:100%;border:0;border-radius:17px;padding:16px;margin-top:16px;font-weight:900;font-size:20px;cursor:pointer}
    .login-btn{background:var(--blue);color:#fff}
    .login-btn:disabled{opacity:.65}
    .error{color:#b42318;background:#fef3f2;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
    .footer{margin-top:22px;text-align:center;color:#667085;font-size:13px;line-height:1.8}
    #mapPage{min-height:100vh;background:#fff}
    .topbar{background:var(--blue);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 15px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;z-index:10}
    .topbar h1{font-size:27px;margin:0;font-weight:900}
    .topbar .account{font-size:13px;opacity:.9;margin-top:4px}
    .map-wrap{position:relative;height:calc(100vh - 116px);min-height:520px}
    #map{height:100%;width:100%}
    .map-status{position:absolute;top:14px;right:14px;left:14px;z-index:500;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:16px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.16);font-weight:800;text-align:center}
    .map-status.ok{color:#166534}
    .map-status.err{color:#b42318}
    .controls{position:absolute;right:14px;left:14px;bottom:16px;z-index:500;display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .control-btn{border:0;border-radius:15px;padding:13px 8px;font-weight:900;font-size:16px;box-shadow:0 4px 15px rgba(0,0,0,.18);cursor:pointer}
    .start{background:var(--green);color:#fff}
    .start.active{background:#6b7280;color:#fff}
    .stop{background:var(--red);color:#fff}
    .logout{position:absolute;top:14px;left:14px;z-index:20;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:800}
    .leaflet-control-attribution{font-size:9px}
    .bus-marker{width:44px;height:44px;border-radius:50%;background:#1976d2;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:23px}
    @media(max-width:430px){.topbar h1{font-size:23px}.map-wrap{min-height:560px}}
  </style>
</head>
<body>

  <section id="loginPage">
    <div class="login-card">
      <div class="bus-icon">🚌</div>
      <h1 class="login-title">لوحة السائق - باص 2</h1>

      <label for="password">الرقم السري</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="أدخل الرقم السري">

      <button class="btn login-btn" id="loginBtn">تسجيل الدخول</button>
      <div id="loginError" class="error hidden"></div>

      <div class="footer">
        إعداد وتصميم : ذكريات حسين الزوايده<br>
        مدرسة الديسة الثانوية للبنات
      </div>
    </div>
  </section>

  <section id="mapPage" class="hidden">
    <header class="topbar">
      <button class="logout" id="logoutBtn">تسجيل الخروج</button>
      <h1>🚌 لوحة السائق - باص 2</h1>
      <div class="account" id="account"></div>
    </header>

    <div class="map-wrap">
      <div id="mapStatus" class="map-status">جارٍ تجهيز GPS والحصول على قراءة جديدة…</div>
      <div id="map"></div>
      <div class="controls">
        <button class="control-btn start" id="startBtn">🟢 بدء إرسال الموقع</button>
        <button class="control-btn stop" id="stopBtn">🔴 إيقاف الإرسال</button>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function(){
    "use strict";

    const SUPABASE_URL = "https://cfzqkgrzhepaxhsmqfdk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rZYDPp6tTYc61BndkESM0Q_PZ9jglB4";
    const BUS_NAME = "bus2";
    const TABLE = "buses2026";
    const FIXED_EMAIL = "driver2@desah-bus.com";

    let accessToken = null;
    let refreshToken = null;
    let watchId = null;
    let marker = null;
    let lastValidPosition = null;
    let gpsStartedAt = 0;
    let gpsSessionId = 0;
    let sendingActive = false;

    const $ = id => document.getElementById(id);

    const map = L.map("map", {zoomControl:true, attributionControl:true}).setView([29.65,35.50], 12);

    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:19, attribution:"Tiles &copy; Esri"}
    );

    const labels = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:19, opacity:.9, attribution:"&copy; Esri"}
    );

    satellite.addTo(map);
    labels.addTo(map);

    const busIcon = L.divIcon({
      className:"",
      html:'<div class="bus-marker">🚌</div>',
      iconSize:[44,44],
      iconAnchor:[22,22]
    });

    function setMapStatus(text, type){
      const el = $("mapStatus");
      el.textContent = text;
      el.className = "map-status" + (type === "ok" ? " ok" : type === "err" ? " err" : "");
    }

    function calculateDistance(lat1, lon1, lat2, lon2){
      const R = 6371e3;
      const dLat = (lat2-lat1)*Math.PI/180;
      const dLon = (lon2-lon1)*Math.PI/180;
      const a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function removeMarker(){
      if(marker){
        map.removeLayer(marker);
        marker = null;
      }
    }

    function showPosition(pos){
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      if(!marker){
        marker = L.marker([lat,lng], {icon:busIcon}).addTo(map);
        marker.bindPopup("🚌 باص 2");
      }else{
        marker.setLatLng([lat,lng]);
      }

      map.setView([lat,lng], Math.max(map.getZoom(),16), {animate:true});
    }

    function geoError(err){
      let msg = "تعذر تحديد موقع الباص.";
      if(err && err.code === 1) msg = "يرجى السماح للموقع من إعدادات المتصفح.";
      else if(err && err.code === 2) msg = "تعذر الحصول على الموقع حاليًا.";
      else if(err && err.code === 3) msg = "انتهت مهلة تحديد الموقع.";
      setMapStatus("❌ " + msg, "err");
    }

    function saveSession(data, email){
      accessToken = data.access_token || null;
      refreshToken = data.refresh_token || null;
      if(accessToken){
        localStorage.setItem("bus2_session", JSON.stringify({
          access_token:accessToken,
          refresh_token:refreshToken,
          email:email || FIXED_EMAIL
        }));
      }
    }

    function clearSession(){
      accessToken = null;
      refreshToken = null;
      localStorage.removeItem("bus2_session");
    }

    async function clearOldLocation(){
      if(!accessToken) return false;

      const res = await fetch(
        SUPABASE_URL + "/rest/v1/" + TABLE +
        "?bus=eq." + encodeURIComponent(BUS_NAME),
        {
          method:"PATCH",
          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_ANON_KEY,
            "Authorization":"Bearer " + accessToken,
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            lat:null,
            lng:null,
            timestamp:null
          })
        }
      );

      if(!res.ok) throw new Error(await res.text());
      return true;
    }

    async function prepareFreshGPS(){
      removeMarker();
      lastValidPosition = null;
      setMapStatus("🧭 جارٍ الحصول على قراءة GPS جديدة فقط…");

      try{
        await clearOldLocation();
      }catch(e){
        console.error("clearOldLocation:", e);
        setMapStatus("⚠️ تعذر مسح الموقع القديم من قاعدة البيانات", "err");
      }

      gpsSessionId++;
      gpsStartedAt = Date.now();
    }

    async function restoreSession(){
      let saved = null;
      try{
        saved = JSON.parse(localStorage.getItem("bus2_session") || "null");
      }catch(e){}

      if(!saved || !saved.refresh_token || !saved.access_token) return false;

      try{
        const res = await fetch(
          SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "apikey":SUPABASE_ANON_KEY
            },
            body:JSON.stringify({refresh_token:saved.refresh_token})
          }
        );

        const data = await res.json();
        if(!res.ok || !data.access_token) throw new Error("انتهت جلسة الدخول");

        saveSession(data, FIXED_EMAIL);
        $("account").textContent = FIXED_EMAIL;
        $("loginPage").classList.add("hidden");
        $("mapPage").classList.remove("hidden");
        setTimeout(()=>map.invalidateSize(),100);

        await prepareFreshGPS();
        startGPS(false);
        return true;
      }catch(e){
        clearSession();
        return false;
      }
    }

    async function login(){
      const password = $("password").value;
      const error = $("loginError");
      error.classList.add("hidden");

      if(!password){
        error.textContent = "أدخل الرقم السري.";
        error.classList.remove("hidden");
        return;
      }

      const btn = $("loginBtn");
      btn.disabled = true;
      btn.textContent = "جاري تسجيل الدخول…";

      try{
        const res = await fetch(
          SUPABASE_URL + "/auth/v1/token?grant_type=password",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "apikey":SUPABASE_ANON_KEY
            },
            body:JSON.stringify({
              email:FIXED_EMAIL,
              password:password
            })
          }
        );

        const data = await res.json();

        if(!res.ok || !data.access_token){
          throw new Error(
            data.error_description ||
            data.msg ||
            "فشل تسجيل الدخول، تأكد من صحة الرقم السري"
          );
        }

        saveSession(data, FIXED_EMAIL);
        $("account").textContent = FIXED_EMAIL;
        $("loginPage").classList.add("hidden");
        $("mapPage").classList.remove("hidden");
        setTimeout(()=>map.invalidateSize(),100);

        await prepareFreshGPS();
        startGPS(false);

      }catch(err){
        error.textContent = err.message || String(err);
        error.classList.remove("hidden");
      }finally{
        btn.disabled = false;
        btn.textContent = "تسجيل الدخول";
      }
    }

    async function updateBus(lat,lng){
      if(!accessToken) throw new Error("انتهت جلسة الدخول.");

      const res = await fetch(
        SUPABASE_URL + "/rest/v1/" + TABLE +
        "?bus=eq." + encodeURIComponent(BUS_NAME),
        {
          method:"PATCH",
          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_ANON_KEY,
            "Authorization":"Bearer " + accessToken,
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            lat:Number(lat),
            lng:Number(lng),
            timestamp:Date.now()
          })
        }
      );

      if(!res.ok) throw new Error(await res.text());
    }

    function startGPS(sendToServer){
      if(!navigator.geolocation){
        setMapStatus("❌ المتصفح لا يدعم الموقع.","err");
        return;
      }

      if(watchId !== null){
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      const thisSession = ++gpsSessionId;
      gpsStartedAt = Date.now();

      setMapStatus(
        sendToServer
          ? "📍 جارٍ انتظار قراءة GPS جديدة لإرسالها…"
          : "📍 جارٍ انتظار قراءة GPS جديدة…"
      );

      watchId = navigator.geolocation.watchPosition(
        pos=>{
          if(thisSession !== gpsSessionId) return;

          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = Number(pos.coords.accuracy);
          const positionTime = Number(pos.timestamp || Date.now());

          if(!Number.isFinite(lat) || !Number.isFinite(lng)) return;
          if(!Number.isFinite(accuracy)) return;

          if(positionTime < gpsStartedAt - 1000){
            setMapStatus("⏳ بانتظار قراءة GPS جديدة…");
            return;
          }

          if(accuracy > 50){
            setMapStatus(
              "⚠️ إشارة GPS غير دقيقة حاليًا (" +
              Math.round(accuracy) + "م)…",
              "err"
            );
            return;
          }

          if(lastValidPosition){
            const distance = calculateDistance(
              lastValidPosition.lat,
              lastValidPosition.lng,
              lat,
              lng
            );

            const elapsedSeconds =
              Math.max(1,(positionTime-lastValidPosition.time)/1000);

            const maxDistance =
              Math.max(300, (150/3.6)*elapsedSeconds + 100);

            if(distance > maxDistance){
              setMapStatus("⚠️ تم تجاهل قفزة GPS غير منطقية…","err");
              return;
            }
          }

          lastValidPosition = {
            lat:lat,
            lng:lng,
            time:positionTime
          };

          showPosition(pos);

          if(sendToServer){
            updateBus(lat,lng)
              .then(()=>setMapStatus("🟢 تم تحديث موقع الباص بدقة","ok"))
              .catch(err=>setMapStatus("⚠️ تعذر الإرسال: " + err.message,"err"));
          }else{
            setMapStatus(
              "📍 تم الحصول على موقع GPS جديد. اضغط «بدء إرسال الموقع» لإرساله.",
              "ok"
            );
          }
        },
        geoError,
        {
          enableHighAccuracy:true,
          maximumAge:0,
          timeout:20000
        }
      );
    }

    async function startSending(){
      sendingActive = true;

      const btn = $("startBtn");
      btn.classList.add("active");
      btn.textContent = "⚪ إرسال الموقع يعمل";

      try{
        await clearOldLocation();
      }catch(e){
        setMapStatus("⚠️ تعذر مسح الموقع القديم قبل الإرسال","err");
      }

      removeMarker();
      lastValidPosition = null;
      startGPS(true);
    }

    async function stopSending(){
      sendingActive = false;

      if(watchId !== null){
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      gpsSessionId++;

      const startBtn = $("startBtn");
      startBtn.classList.remove("active");
      startBtn.textContent = "🟢 بدء إرسال الموقع";

      lastValidPosition = null;
      removeMarker();

      if(!accessToken) return;

      try{
        await clearOldLocation();
        setMapStatus("🔴 تم إيقاف الإرسال ومسح الموقع القديم","ok");
      }catch(err){
        setMapStatus("⚠️ تم الإيقاف ولكن تعذر مسح الإحداثيات","err");
      }
    }

    async function logout(){
      if(watchId !== null){
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      gpsSessionId++;
      sendingActive = false;

      if(accessToken){
        try{ await clearOldLocation(); }catch(e){}

        try{
          await fetch(SUPABASE_URL + "/auth/v1/logout",{
            method:"POST",
            headers:{
              "apikey":SUPABASE_ANON_KEY,
              "Authorization":"Bearer " + accessToken
            }
          });
        }catch(e){}
      }

      clearSession();
      lastValidPosition = null;
      removeMarker();

      $("mapPage").classList.add("hidden");
      $("loginPage").classList.remove("hidden");
      $("password").value="";
      setMapStatus("جارٍ تجهيز GPS والحصول على قراءة جديدة…");
    }

    $("loginBtn").addEventListener("click",login);
    $("startBtn").addEventListener("click",startSending);
    $("stopBtn").addEventListener("click",stopSending);
    $("logoutBtn").addEventListener("click",logout);
    $("password").addEventListener("keydown",e=>{
      if(e.key==="Enter") login();
    });

    restoreSession();
  })();
  </script>
</body>
</html>
