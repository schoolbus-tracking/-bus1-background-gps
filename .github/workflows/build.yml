name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Find and Extract ZIP File
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d ./temp_extracted
          # Move files to root directory
          if [ -d "./temp_extracted/BUS1_Android_Background_Ready 2" ]; then
            cp -rn "./temp_extracted/BUS1_Android_Background_Ready 2"/* ./
          else
            cp -rn ./temp_extracted/*/* ./ || cp -rn ./temp_extracted/* ./
          fi
          rm -rf ./temp_extracted
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
